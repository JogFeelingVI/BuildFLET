name: Flet Builds

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: "Build Linux"
        type: boolean
        default: true
      # build_macos:
      #   description: 'Build macOS'
      #   type: boolean
      #   default: false
      build_windows:
        description: "Build Windows"
        type: boolean
        default: false
      # build_aab:
      #   description: 'Build Android AAB'
      #   type: boolean
      #   default: false
      build_apk:
        description: "Build Android APK"
        type: boolean
        default: true # 默认勾选 apk
      # build_ipa:
      #   description: 'Build iOS IPA'
      #   type: boolean
      #   default: false
      build_web:
        description: "Build Web"
        type: boolean
        default: false

env:
  UV_PYTHON: 3.12.12 # Python version
  PYTHONUTF8: 1
  # https://docs.flet.dev/publish/
  BUILD_NUMBER: ${{ github.run_number }}
  BUILD_VERSION: "1.0.${{ github.run_number }}"
  # https://docs.flet.dev/reference/environment-variables
  FLET_CLI_NO_RICH_OUTPUT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # -------- Desktop --------
          - name: linux
            should_build: ${{ inputs.build_linux }}
            runner: ubuntu-latest
            build_cmd: "flet build linux --yes --verbose --build-number=$BUILD_NUMBER --build-version=$BUILD_VERSION"
            artifact_path: build/linux
            needs_linux_deps: true

          # - name: macos
          #   should_build: ${{ inputs.build_macos }}
          #   runner: macos-latest
          #   build_cmd: "flet build macos --yes --verbose --build-number=$BUILD_NUMBER --build-version=$BUILD_VERSION"
          #   artifact_path: build/macos
          #   needs_linux_deps: false

          - name: windows
            should_build: ${{ inputs.build_windows }}
            runner: windows-latest
            build_cmd: "flet build windows --yes --verbose --build-number=$BUILD_NUMBER --build-version=$BUILD_VERSION"
            artifact_path: build/windows
            needs_linux_deps: false

          # -------- Android --------
          # - name: aab
          #   should_build: ${{ inputs.build_aab }}
          #   runner: ubuntu-latest
          #   build_cmd: "flet build aab --yes --verbose --build-number=$BUILD_NUMBER --build-version=$BUILD_VERSION"
          #   artifact_path: build/aab
          #   needs_linux_deps: false

          - name: apk
            should_build: ${{ inputs.build_apk }}
            runner: ubuntu-latest
            build_cmd: "flet build apk --yes --verbose --build-number=$BUILD_NUMBER --build-version=$BUILD_VERSION"
            artifact_path: build/apk
            needs_linux_deps: false

          # -------- iOS --------
          # - name: ipa
          #   should_build: ${{ inputs.build_ipa }}
          #   runner: macos-latest
          #   build_cmd: "flet build ipa --yes --verbose --build-number=$BUILD_NUMBER --build-version=$BUILD_VERSION"
          #   artifact_path: build/ipa
          #   needs_linux_deps: false

          # -------- Web --------
          - name: web
            should_build: ${{ inputs.build_web }}
            runner: ubuntu-latest
            build_cmd: "flet build web --yes --verbose"
            artifact_path: build/web
            needs_linux_deps: false

    steps:
      - name: Checkout repository
        if: matrix.should_build == true || matrix.should_build == 'true'
        uses: actions/checkout@v4

      - name: Setup uv
        if: matrix.should_build == true || matrix.should_build == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: (matrix.should_build == true || matrix.should_build == 'true') && matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          sudo apt-get install -y --no-install-recommends \
            clang \
            ninja-build \
            libgtk-3-dev \
            libasound2-dev \
            libmpv-dev \
            mpv \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-x \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-gtk3 \
            gstreamer1.0-qt5 \
            gstreamer1.0-pulseaudio \
            pkg-config \
            libsecret-1-0 \
            libsecret-1-dev
          sudo apt-get clean

      - name: Build app
        if: matrix.should_build == true || matrix.should_build == 'true'
        shell: bash
        run: |
          uv run ${{ matrix.build_cmd }}

      - name: Upload Artifact
        if: matrix.should_build == true || matrix.should_build == 'true'
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ matrix.name }}-build-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          overwrite: false
          retention-days: 5 
          # 2. 压缩级别（v4+ 支持，1-9，增加压缩率可节省空间）
          compression-level: 9 
